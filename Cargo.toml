[package]
name = "modus"
version = "0.1.0"
edition = "2024"

[lib]
name = "modus"
path = "src/lib.rs"

[[bin]]
name = "modus"
path = "src/main.rs"

[dependencies]
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tower-lsp = "0.20"
tree-sitter-modus = { path = "editor" }

[package]
name = "tree-sitter-modus"
version = "0.1.0"
edition = "2021"
description = "Modus grammar for the tree-sitter parsing library"
license = "MIT"
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "grammar.js",
    "queries/*",
    "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.25"

[build-dependencies]
cc = "1.0"
